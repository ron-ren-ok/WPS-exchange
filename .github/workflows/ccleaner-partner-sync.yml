name: CCleaner partner sync

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Inclusive start date (YYYY-MM-DD); blank defaults to 7 days ending at end_date"
        required: false
        type: string
      end_date:
        description: "Inclusive end date (YYYY-MM-DD); defaults to yesterday Beijing time"
        required: false
        type: string

  schedule:
    # 03:00 Beijing time = 19:00 UTC on the preceding day.
    - cron: "0 19 * * *"
permissions:
  contents: read

concurrency:
  group: ccleaner-partner-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ccleaner-partner-sync
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ccleaner-partner-sync/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run CCleaner sync
        run: |
          args=()
          if [ -n "$START_DATE" ]; then args+=(--start-date "$START_DATE"); fi
          if [ -n "$END_DATE" ]; then args+=(--end-date "$END_DATE"); fi
          python src/ccleaner_partner_sync.py "${args[@]}"
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          GOOGLE_SHEET_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEET_SERVICE_ACCOUNT_JSON }}
          GMAIL_IMAP_USERNAME: ${{ secrets.GMAIL_IMAP_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
