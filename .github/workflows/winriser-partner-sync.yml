name: Winriser partner sync

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date (YYYY-MM-DD); enables interval backfill"
        required: false
        type: string
      end_date:
        description: "End date (YYYY-MM-DD); defaults to yesterday Beijing time"
        required: false
        type: string
  schedule:
    - cron: "0 19 * * *"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: winriser-partner-sync
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: winriser-partner-sync/requirements.txt
      - run: pip install -r requirements.txt
      - run: |
          args=(--allow-overwrite)
          if [[ -n "$START_DATE" ]]; then args+=(--start-date "$START_DATE"); fi
          if [[ -n "$END_DATE" ]]; then args+=(--end-date "$END_DATE"); fi
          python src/winriser_partner_sync.py "${args[@]}"
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          GOOGLE_SHEET_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEET_SERVICE_ACCOUNT_JSON }}
          WINRISER_LOGIN_SECRET: ${{ secrets.WINRISER_LOGIN_SECRET }}
