name: Winriser partner sync-Country
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Start date (YYYY-MM-DD); enables interval backfill
        required: false
        type: string
      end_date:
        description: End date (YYYY-MM-DD); defaults to yesterday Beijing time
        required: false
        type: string
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: winriser-partner-sync-country
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: >-
          python src/winriser_partner_sync_country.py
          ${{ inputs.start_date && format('--start-date {0}', inputs.start_date) || '' }}
          ${{ inputs.end_date && format('--end-date {0}', inputs.end_date) || '' }}
          --allow-overwrite
        env:
          GOOGLE_SHEET_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEET_SERVICE_ACCOUNT_JSON }}
          WINRISER_LOGIN_SECRET: ${{ secrets.WINRISER_LOGIN_SECRET }}
