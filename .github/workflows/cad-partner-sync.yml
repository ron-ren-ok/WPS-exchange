name: CAD partner sync

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date (YYYY-MM-DD); omit for incremental sync"
        required: false
        type: string
      end_date:
        description: "End date (YYYY-MM-DD); defaults to yesterday Beijing time"
        required: false
        type: string
      allow_overwrite:
        description: "Overwrite a different non-empty target value"
        required: false
        default: false
        type: boolean
  schedule:
    # 03:00 Beijing time = 19:00 UTC on the preceding day.
    - cron: "0 19 * * *"

permissions:
  contents: read

concurrency:
  group: cad-partner-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cad-partner-sync
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: >-
          python src/cad_partner_sync.py
          ${{ inputs.start_date && format('--start-date {0}', inputs.start_date) || '' }}
          ${{ inputs.end_date && format('--end-date {0}', inputs.end_date) || '' }}
          ${{ inputs.allow_overwrite && '--allow-overwrite' || '' }}
        env:
          GOOGLE_SHEET_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEET_SERVICE_ACCOUNT_JSON }}
