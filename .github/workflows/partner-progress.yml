name: WPS partner progress

on:
  schedule:
    # 04:10 Beijing time (20:10 UTC on the preceding day), every day.
    - cron: "10 20 * * *"
  workflow_dispatch:
    inputs:
      webhook_target:
        description: "Webhook target (production is the default)"
        required: true
        default: production
        type: choice
        options:
          - test
          - production

permissions:
  contents: read

jobs:
  send-partner-progress:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: partner-progress
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: partner-progress/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate report calculations and card delivery
        run: python -m unittest discover -s tests -v
      - name: Prepare partner progress content
        env:
          GOOGLE_SHEET_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEET_SERVICE_ACCOUNT_JSON }}
        run: >-
          python scripts/send_partner_progress.py
          --revenue-output "$RUNNER_TEMP/wps-revenue-partners.md"
          --new-output "$RUNNER_TEMP/wps-new-partners.md"
      - name: Send revenue then new-user partner cards
        shell: pwsh
        env:
          WPS_WEBHOOK_URL: ${{ secrets[github.event_name == 'workflow_dispatch' && inputs.webhook_target == 'test' && 'WPS_WEBHOOK_URL_TEST' || 'WPS_WEBHOOK_URL'] }}
          WPS_WEBHOOK_KEY: ${{ secrets.WPS_WEBHOOK_KEY }}
          WPS_WEBHOOK_SECRET: ${{ secrets.WPS_WEBHOOK_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WPS_WEBHOOK_URL)) { throw 'The selected Webhook target is not configured.' }
          $revenueText = Get-Content -LiteralPath "$env:RUNNER_TEMP/wps-revenue-partners.md" -Raw -Encoding utf8
          $newText = Get-Content -LiteralPath "$env:RUNNER_TEMP/wps-new-partners.md" -Raw -Encoding utf8
          $beijingDate = [DateTime]::UtcNow.AddHours(8).ToString('yyyy-MM-dd')
          ./scripts/send-wps-webhook.ps1 -CardTitle '📊血量合作方日报' -CardSubtitle $beijingDate -CardText $revenueText -WebhookUrl $env:WPS_WEBHOOK_URL
          Start-Sleep -Seconds 3
          ./scripts/send-wps-webhook.ps1 -CardTitle '📊新增合作方日报' -CardSubtitle $beijingDate -CardText $newText -WebhookUrl $env:WPS_WEBHOOK_URL
