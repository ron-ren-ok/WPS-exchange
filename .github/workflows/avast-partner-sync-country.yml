name: Avast partner sync-Country

on:
  workflow_dispatch:
    inputs:
      end_date:
        description: Optional latest data date (YYYY-MM-DD); defaults to the newest date in the CSV
        required: false
        type: string

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: avast-partner-sync-country
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: >-
          python src/avast_partner_sync_country.py
          ${{ inputs.end_date && format('--end-date {0}', inputs.end_date) || '' }}
        env:
          GOOGLE_SHEET_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEET_SERVICE_ACCOUNT_JSON }}
          GMAIL_IMAP_USERNAME: ${{ secrets.GMAIL_IMAP_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
