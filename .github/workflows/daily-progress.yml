name: WPS daily progress

on:
  schedule:
    # 04:00 Beijing time (20:00 UTC on the preceding day), every day.
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      webhook_target:
        description: "Webhook target (test is the default for manual runs)"
        required: true
        default: test
        type: choice
        options:
          - test
          - production

permissions:
  contents: read

jobs:
  send-daily-progress:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daily-progress
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: daily-progress/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Prepare combined daily progress card
        env:
          GOOGLE_SHEET_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEET_SERVICE_ACCOUNT_JSON }}
        run: >-
          python scripts/prepare_progress_card.py
          --output "$RUNNER_TEMP/wps-daily-progress.md"
          --subtitle-output "$RUNNER_TEMP/wps-daily-progress-subtitle.txt"
          --elements-output "$RUNNER_TEMP/wps-daily-progress-elements.json"
      - name: Send WPS combined daily progress card
        shell: pwsh
        env:
          WEBHOOK_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.webhook_target || 'production' }}
          WPS_WEBHOOK_URL_TEST: ${{ secrets.WPS_WEBHOOK_URL_TEST }}
          WPS_WEBHOOK_URL: ${{ secrets.WPS_WEBHOOK_URL }}
          WPS_WEBHOOK_KEY: ${{ secrets.WPS_WEBHOOK_KEY }}
          WPS_WEBHOOK_SECRET: ${{ secrets.WPS_WEBHOOK_SECRET }}
        run: |
          $cardElements = Get-Content -LiteralPath "$env:RUNNER_TEMP/wps-daily-progress-elements.json" -Raw -Encoding utf8
          $subtitle = Get-Content -LiteralPath "$env:RUNNER_TEMP/wps-daily-progress-subtitle.txt" -Raw -Encoding utf8
          $webhookUrl = if ($env:WEBHOOK_TARGET -eq 'test') { $env:WPS_WEBHOOK_URL_TEST } else { $env:WPS_WEBHOOK_URL }
          if ([string]::IsNullOrWhiteSpace($webhookUrl)) { throw 'Selected webhook target is not configured.' }
          ./scripts/send-wps-webhook.ps1 -ValidateOnly -WebhookUrl $webhookUrl
          ./scripts/send-wps-webhook.ps1 -CardTitle '📣日血量进度与月底预测' -CardSubtitle $subtitle.Trim() -CardElementsJson $cardElements -WebhookUrl $webhookUrl
